services:
  db:
    container_name: postgres_container
    image: postgres:18.2
    ports:
      - 5000:5432
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
      - my_network
    
  airflow:
    container_name: airflow_container
    build: .
    ports:
      - 8080:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
      AIRFLOW_CONN_VICTOR_CONEXAO: google-cloud-platform://?extra__google_cloud_platform__key_path=/opt/airflow/keys/service_account/example_service_account.json&extra__google_cloud_platform__project=pipeline-airflow-docker-example
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./keys/service_account/example_service_account.json:/opt/airflow/keys/service_account/example_service_account.json:ro
    depends_on:
      - db
    networks:
      - my_network
    command: >
      bash -c "airflow standalone"

networks:
  my_network:
    driver: bridge